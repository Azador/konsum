# Startet Caddy, der die gebaute Web-App (app/build/web) ausliefert.
# Vorher bauen: ./build.sh
services:
  konsum-web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      KONSUM_HOST: ${KONSUM_HOST:-loboci}
      KONSUM_HTTPS_PORT: ${KONSUM_HTTPS_PORT:-8443}
      KONSUM_HTTP_PORT: ${KONSUM_HTTP_PORT:-8080}
    ports:
      # Zum Einschränken auf eine Netzwerkkarte: "192.168.1.10:8443:8443"
      - "${KONSUM_HTTPS_PORT:-8443}:${KONSUM_HTTPS_PORT:-8443}"
      - "${KONSUM_HTTP_PORT:-8080}:${KONSUM_HTTP_PORT:-8080}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../app/build/web:/srv:ro
      # Enthält die lokale CA – unbedingt behalten, sonst müssen alle Geräte
      # ein neues Stammzertifikat installieren.
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]

volumes:
  caddy_data:
  caddy_config:
