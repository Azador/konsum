WebSite: https://konsum.azadoro.de
SourceCode: https://github.com/Azador/konsum
IssueTracker: https://github.com/Azador/konsum/issues
Changelog: https://github.com/Azador/konsum/releases

AutoName: Konsum

RepoType: git
Repo: https://github.com/Azador/konsum.git

Builds:
  - versionName: 0.6.6
    versionCode: 13
    commit: v0.6.6
    subdir: app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.8
    prebuild:
      - curl -Lo /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-unknown-linux-gnu/rustup-init
      - echo '5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4  /tmp/rustup-init'
        | sha256sum -c -
      - chmod +x /tmp/rustup-init
      - /tmp/rustup-init -y --profile minimal --default-toolchain stable
      - $HOME/.cargo/bin/rustup target add armv7-linux-androideabi aarch64-linux-android
        x86_64-linux-android
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache PATH=$HOME/.cargo/bin:$PATH
      - $$flutter$$/bin/flutter build apk --release
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.6.6
CurrentVersionCode: 13
