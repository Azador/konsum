name: konsum
description: "Gemeinsame Einkaufsliste"
publish_to: 'none'
version: 0.8.1+22

environment:
  sdk: ^3.13.7

dependencies:
  app_links: ^7.2.2
  dbus: ^0.8.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_vodozemac: ^0.9.0
  flutter_zxing: ^3.1.0
  http: ^1.6.0
  intl: ^0.20.3
  konsum_core:
    path: ../packages/konsum_core
  konsum_matrix:
    path: ../packages/konsum_matrix
  matrix: ^14.2.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  url_launcher: ^6.3.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Roboto selbst mitgeliefert (SIL OFL 1.1, assets/fonts/OFL.txt). Flutter
  # Web lädt Roboto sonst von Google Fonts.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

# Die FFI-Datenbank (nur Linux) nimmt SQLCipher aus dem System: Die
# Linux-App ist gegen libsqlcipher gelinkt (linux/runner/CMakeLists.txt,
# Debian/Ubuntu: libsqlcipher-dev), die Dart-Seite sucht die sqlite3-Funktionen
# im Prozess. Die Matrix-Daten werden verschlüsselt, der Schlüssel liegt im
# Schlüsselbund. Bewusst nicht `source: sqlcipher`: Das lädt fertige
# Bibliotheken von GitHub und packt sie auch in die Android-App, die sie nicht
# braucht (sie nutzt sqflite). Fertige Binärdateien im Build lehnt F-Droid ab.
hooks:
  user_defines:
    sqlite3:
      source: process
