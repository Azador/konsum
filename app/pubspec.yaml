name: konsum
description: "Gemeinsame Einkaufsliste"
publish_to: 'none'
version: 0.5.0+6

environment:
  sdk: ^3.13.7

dependencies:
  app_links: ^7.2.2
  dbus: ^0.8.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_vodozemac: ^0.9.0
  http: ^1.6.0
  intl: ^0.20.3
  konsum_core:
    path: ../packages/konsum_core
  konsum_matrix:
    path: ../packages/konsum_matrix
  matrix: ^14.2.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  url_launcher: ^6.3.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# SQLCipher statt SQLite für die FFI-Datenbank (Linux): Die Matrix-Daten
# werden verschlüsselt, der Schlüssel liegt in KWallet. Android nutzt die
# SQLite des Systems über sqflite und ist davon nicht betroffen.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
