# Tests und Installationspakete für jeden Push auf main und jeden PR.
# Der Job „Ergebnis“ ist nur grün, wenn alle anderen Jobs grün sind; ihn als
# Pflicht-Check in der Regel für main eintragen.
#
# Die APK wird signiert, wenn diese Secrets gesetzt sind (sonst unsigniert,
# nicht installierbar). Das App-Bundle für Google Play baut release.yml.
#   ANDROID_KEYSTORE_BASE64   base64 -w0 konsum-release.jks
#   ANDROID_KEYSTORE_PASSWORD Passwort des Keystores
#   ANDROID_KEY_ALIAS         z. B. konsum
name: Build
# Von Hand: gewählter Branch; PR: Quell-Branch; Push: Branch des Pushes.
run-name: Build ${{ inputs.branch || github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, der gebaut wird
        required: true
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Beim Start von Hand der gewählte Branch, sonst der des Ereignisses.
          ref: ${{ inputs.branch || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: konsum_core
        working-directory: packages/konsum_core
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: konsum_matrix
        working-directory: packages/konsum_matrix
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: App
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test

  android:
    name: Android
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Beim Start von Hand der gewählte Branch, sonst der des Ereignisses.
          ref: ${{ inputs.branch || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signierschlüssel
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Keine Signier-Secrets – APK bleibt unsigniert"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/konsum.jks"
          {
            echo "storeFile=$RUNNER_TEMP/konsum.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=${ALIAS:-konsum}"
          } > app/android/key.properties
          echo "SIGNED=1" >> "$GITHUB_ENV"
      - name: APK bauen
        working-directory: app
        run: |
          flutter build apk --release
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir -p ../dist
          if [ -n "${SIGNED:-}" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "../dist/konsum-$version.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "../dist/konsum-$version-unsigned.apk"
          fi
      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/konsum.jks" app/android/key.properties
      # Je Datei ein Artefakt, ohne ZIP drumherum.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.apk
          archive: false
          if-no-files-found: error

  linux:
    name: Linux
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Beim Start von Hand der gewählte Branch, sonst der des Ereignisses.
          ref: ${{ inputs.branch || github.ref }}
      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsqlcipher-dev dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Bauen
        working-directory: app
        run: flutter build linux --release
      - name: Pakete (.deb, .tar.gz)
        run: deploy/linux/package.sh dist
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.deb
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false
          if-no-files-found: error

  web:
    name: Web
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Beim Start von Hand der gewählte Branch, sonst der des Ereignisses.
          ref: ${{ inputs.branch || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust nightly für WebAssembly
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src --target wasm32-unknown-unknown
      - name: Version von flutter_rust_bridge_codegen
        working-directory: app
        run: |
          flutter pub get >/dev/null
          dir="$(grep -A1 '"name": "vodozemac"' .dart_tool/package_config.json |
            sed -n 's|.*"rootUri": "file://\(.*\)".*|\1|p')"
          frb="$(sed -n "s/.*codegenVersion => '\(.*\)';/\1/p" \
            "$dir/lib/src/generated/frb_generated.dart")"
          echo "FRB_VERSION=$frb" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/wasm-pack
          key: web-tools-${{ runner.os }}-frb-${{ env.FRB_VERSION }}-v1
      - name: Werkzeuge
        run: |
          command -v flutter_rust_bridge_codegen ||
            cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked
          command -v wasm-pack || cargo install wasm-pack --locked
      - name: Bauen
        run: deploy/web/build.sh
      - name: Paket
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)"
          mkdir -p dist
          tar -C app/build -czf "dist/konsum-$version-web.tar.gz" web
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false
          if-no-files-found: error

  result:
    name: Ergebnis
    if: always()
    needs: [test, android, linux, web]
    runs-on: ubuntu-24.04
    steps:
      - name: Alle Jobs erfolgreich?
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Ergebnisse: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
